name: Report a problem with an item
description: Something in the catalog does not work, is wrong or should not be here.
labels: [problem]
body:
  - type: input
    id: item
    attributes: { label: Item ID, placeholder: "e.g. community.sports-scores" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened }
    validations: { required: true }
